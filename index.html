
<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ծննդյան հրավիրատոմս</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: Georgia, serif;
  text-align: center;
  color: #805468;
  background: linear-gradient(135deg, #fff5f7, #f4d5e1);
}
.card {
  width: 100%;
  max-width: 420px;
  padding: 35px 24px;
  background: #fffaf8;
  border: 2px solid #d8b66e;
  border-radius: 180px 180px 22px 22px;
  box-shadow: 0 10px 35px #9d647522;
}
.flower { font-size: 45px; color: #c29b55; }
h1 { color: #b58a45; font-size: 30px; }
p { line-height: 1.8; }
button {
  padding: 14px 22px;
  background: #bd8c9c;
  color: white;
  border: 0;
  border-radius: 28px;
  font-size: 16px;
}
#invite { display: none; }
#invite.show {
  display: block;
  animation: appear 1s ease;
}
@keyframes appear {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
a { color: #a77939; }
</style>
</head>
<body>
<main class="card">
  <div class="flower">✿</div>
  <p>Սիրով հրավիրում եմ քեզ</p>
  <h1>Իմ ծննդյան օրը</h1>
  <p>Մի գեղեցիկ օր՝ լի ժպիտներով ու սիրով ✨</p>
  <p>Բացիր հրավիրատոմսդ</p>
  <button onclick="openInvite()">Բացել ♡</button>

  <section id="invite">
    <p>Ուրախ կլինեմ միասին տոնելու իմ օրը։</p>
    <h2>♡ Սիրով սպասում եմ ♡</h2>
    <p>📅 Ամսաթիվ՝ լրացրու այստեղ</p>
    <p>🕒 Ժամ՝ լրացրու այստեղ</p>
    <p>📍 Վայր՝ լրացրու այստեղ</p>
    <p><a href="https://maps.google.com/" target="_blank">Բացել քարտեզը</a></p>
    <p>Հաստատիր մասնակցությունդ՝</p>
    <a href="https://wa.me/" target="_blank">
      <button>Հաստատել մասնակցությունը</button>
    </a>
  </section>
</main>
<script>
function openInvite() {
  document.getElementById("invite").classList.add("show");
}
</script>
</body>
</html>
